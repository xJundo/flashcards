# Picked up automatically by `docker compose up` for local runs — Coolify
# only applies docker-compose.yml, so this never reaches the VPS and can't
# collide with another container's host port there.
services:
  web:
    ports:
      - "${PORT:-3000}:3000"
  db:
    # Published so `npm run dev` (outside Docker, for hot reload) can reach
    # Postgres too — matches the port `web/.env.example` already documents.
    ports:
      - "5433:5432"
